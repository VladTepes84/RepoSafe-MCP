name: Security and cross-platform integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reposafe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible dependency installation (integrity-checked lockfile)
        run: npm ci --no-audit --no-fund
      - name: Typecheck, build, unit tests, actual MCP stdio, Git demo
        run: npm run check
      - name: Dependency audit (high/critical production vulnerabilities)
        run: npm run audit:deps
      - name: Composite GitHub Action smoke test (Linux only, report-only)
        if: runner.os == 'Linux'
        id: action
        uses: ./
        with:
          fail-on-findings: 'false'
      - name: Check SARIF file produced by GitHub Action (Linux only)
        if: runner.os == 'Linux'
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif-file }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const data=JSON.parse(readFileSync(process.env.SARIF_PATH,'utf8')); if(data.version!=='2.1.0') process.exit(1)"
      - name: Verify production tarball installation in isolated prefix (Linux only)
        if: runner.os == 'Linux'
        run: node tests/package-install.test.mjs
      - name: Generate and validate local dependency SBOM (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/reposafe-sbom.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/reposafe-sbom.json','utf8')); if(d.bomFormat!=='CycloneDX') process.exit(1)"

