name: Security and cross-platform integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reposafe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible dependency installation (integrity-checked lockfile)
        run: npm ci --no-audit --no-fund
      - name: Typecheck, build, unit tests, actual MCP stdio, Git demo
        run: npm run check
      - name: Dependency audit (high/critical production vulnerabilities)
        run: npm run audit:deps