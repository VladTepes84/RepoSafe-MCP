name: Security and cross-platform integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reposafe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: windows-latest, node: '22' }
          - { os: macos-latest, node: '22' }
          - { os: macos-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Reproducible dependency installation (integrity-checked lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, unit tests, actual MCP stdio, Git demo
        run: npm run check
      - name: Synthetic small/medium/large local scan benchmark
        run: npm run benchmark
      - name: Verify checked-in distribution exactly matches TypeScript build
        run: npm run verify:runtime
      - name: Dependency audit (high/critical production vulnerabilities)
        run: npm run audit:deps
      - name: Composite GitHub Action smoke test (Linux only, report-only)
        if: runner.os == 'Linux'
        id: action
        uses: ./
        with:
          fail-on-findings: 'false'
      - name: Check SARIF file produced by GitHub Action (Linux only)
        if: runner.os == 'Linux'
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif-file }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const data=JSON.parse(readFileSync(process.env.SARIF_PATH,'utf8')); if(data.version!=='2.1.0') process.exit(1)"
      - name: Verify production tarball installation in isolated prefix (Linux only)
        if: runner.os == 'Linux'
        run: node tests/package-install.test.mjs
      - name: Fresh install directly from pinned GitHub source and MCP onboarding (Linux only)
        if: runner.os == 'Linux'
        env:
          REPOSAFE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/github-install.test.mjs

      - name: Script-free pinned GitHub archive install + MCP smoke (all OS)
        env:
          REPOSAFE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/archive-install.test.mjs
      - name: Generate and validate local dependency SBOM (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/reposafe-sbom.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/reposafe-sbom.json','utf8')); if(d.bomFormat!=='CycloneDX') process.exit(1)"
