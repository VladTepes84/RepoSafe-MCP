name: Manual local-first release candidate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reposafe-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use pinned Node runtime line
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate scanner, MCP protocol, runtime and production deps
        run: |
          npm run check
          npm run verify:runtime
          npm run audit:deps
      - name: Assemble package, dependency SBOM and SHA256SUMS without publishing
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/reposafe-candidate"
          mkdir -p "$DEST"
          npm pack --ignore-scripts --pack-destination "$DEST" --json > "$DEST/pack-metadata.json"
          npm sbom --sbom-format cyclonedx > "$DEST/sbom.cdx.json"
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const dir = process.env.RUNNER_TEMP + "/reposafe-candidate";
            const packs = JSON.parse(readFileSync(dir + "/pack-metadata.json", "utf8"));
            if (packs.length !== 1 || !/^reposafe-mcp-.*\.tgz$/.test(packs[0].filename))
              throw new Error("Unexpected npm package result");
            const sbom = JSON.parse(readFileSync(dir + "/sbom.cdx.json", "utf8"));
            if (sbom.bomFormat !== "CycloneDX") throw new Error("Invalid CycloneDX SBOM");
            writeFileSync(dir + "/candidate-manifest.json", JSON.stringify({
              kind: "UNRELEASED_CANDIDATE_NOT_ATTESTATION",
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              node: process.versions.node,
              package: packs[0].filename,
              published: false
            }, null, 2) + "\n");
          '
          ( cd "$DEST" && sha256sum *.tgz *.json > SHA256SUMS )
          test -s "$DEST/SHA256SUMS"
      - name: Store candidate for manual inspection (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reposafe-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/reposafe-candidate/
          if-no-files-found: error
          retention-days: 7
